name: dc1
prefix: ''
mgmt:
  network: eda_mgmt
  ipv4-subnet: 172.21.21.0/24
topology:
  defaults:
    kind: nokia_srlinux
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:24.10.2
    linux:
      image: ghcr.io/srl-labs/network-multitool
      binds:
      - client-configs:/client-configs
  nodes:
    leaf1:
      mgmt-ipv4: 172.21.21.1
      type: ixr-d3l
    leaf2:
      mgmt-ipv4: 172.21.21.2
      type: ixr-d3l
    leaf3:
      mgmt-ipv4: 172.21.21.3
      type: ixr-d3l
    leaf4:
      mgmt-ipv4: 172.21.21.4
      type: ixr-d3l
    leaf5:
      mgmt-ipv4: 172.21.21.5
      type: ixr-d3l
    leaf6:
      mgmt-ipv4: 172.21.21.6
      type: ixr-d3l
    spine1:
      mgmt-ipv4: 172.21.21.101
      type: ixr-d3l
    spine2:
      mgmt-ipv4: 172.21.21.102
      type: ixr-d3l
    cl-l1:
      kind: linux
      mgmt-ipv4: 172.21.21.254
      exec:
      - bash /client-configs/cl-l1.sh
    cl-l2:
      kind: linux
      mgmt-ipv4: 172.21.21.253
      exec:
      - bash /client-configs/cl-l2.sh
    cl-l3:
      kind: linux
      mgmt-ipv4: 172.21.21.252
      exec:
      - bash /client-configs/cl-l3.sh
    cl-l5l6:
      kind: linux
      mgmt-ipv4: 172.21.21.251
      exec:
      - bash /client-configs/cl-l5l6.sh
    cl-leaf4-routed-1:
      kind: linux
      mgmt-ipv4: 172.21.21.250
      exec:
      - bash /client-configs/cl-leaf4-routed-1.sh
  links:
  - endpoints:
    - leaf1:e1-32
    - spine1:e1-1
  - endpoints:
    - leaf1:e1-31
    - spine2:e1-1
  - endpoints:
    - leaf2:e1-32
    - spine1:e1-2
  - endpoints:
    - leaf2:e1-31
    - spine2:e1-2
  - endpoints:
    - leaf3:e1-32
    - spine1:e1-3
  - endpoints:
    - leaf3:e1-31
    - spine2:e1-3
  - endpoints:
    - leaf4:e1-32
    - spine1:e1-4
  - endpoints:
    - leaf4:e1-31
    - spine2:e1-4
  - endpoints:
    - leaf5:e1-32
    - spine1:e1-5
  - endpoints:
    - leaf5:e1-31
    - spine2:e1-5
  - endpoints:
    - leaf6:e1-32
    - spine1:e1-6
  - endpoints:
    - leaf6:e1-31
    - spine2:e1-6
  - endpoints:
    - leaf1:e1-1
    - cl-l1:eth1
  - endpoints:
    - leaf2:e1-1
    - cl-l2:eth1
  - endpoints:
    - leaf3:e1-1
    - cl-l3:eth1
  - endpoints:
    - leaf5:e1-1
    - cl-l5l6:eth1
  - endpoints:
    - leaf6:e1-1
    - cl-l5l6:eth2
  - endpoints:
    - leaf4:e1-1
    - cl-leaf4-routed-1:eth1
