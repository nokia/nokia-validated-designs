    - spine2:e1-6
  - endpoints:
    - leaf7:e1-32
    - spine1:e1-7
  - endpoints:
    - leaf7:e1-31
    - spine2:e1-7
  - endpoints:
    - leaf8:e1-32
    - spine1:e1-8
  - endpoints:
    - leaf8:e1-31
    - spine2:e1-8
  - endpoints:
    - leaf1:e1-3
    - cl-l1:eth1
  - endpoints:
    - leaf1:e1-5
    - cl-l1:eth2
  - endpoints:
    - leaf2:e1-3
    - cl-l2:eth1
  - endpoints:
    - leaf3:e1-3
    - cl-l3:eth1
  - endpoints:
    - leaf4:e1-3
    - cl-l4:eth1
  - endpoints:
