[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nokia-validated-designs"
version = "0.1.0"
description = "Nokia Validated Designs automation engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "requests>=2.31",
    "urllib3>=2.0",
    "ansible-core>=2.19.8",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-html>=4.0",
    "pytest-timeout>=2.3",
    "pytest-metadata>=3.0",
]

[project.scripts]
nvd = "automation.deploy:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "connectivity: steady-state connectivity tests",
    "convergence: failure/recovery convergence tests",
    "slow: tests that take more than 30 seconds",
    "unit: fast unit tests that require no live lab",
]
log_cli = true
log_cli_level = "INFO"
render_collapsed = "passed,skipped"

[tool.setuptools.packages.find]
include = ["automation*"]
