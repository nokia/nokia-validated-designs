[pytest]
addopts = -ra
markers =
    connectivity: steady-state reachability and control-plane checks (non-disruptive)
    ecmp: drives multi-flow traffic and checks it hashes across both DCGWs (non-disruptive)
    disruptive: injects a fault into the running fabric (always restored in teardown)
    convergence: measures the data-plane outage during a failover/redundancy event
