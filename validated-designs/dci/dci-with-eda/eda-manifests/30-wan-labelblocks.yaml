  name: dyn-mcast
  namespace: dci
spec:
  type: Dynamic
  startLabel: 50000
  endLabel: 59999
---
apiVersion: mpls.eda.nokia.com/v1alpha1
kind: LabelBlock
metadata:
  name: sr-global
  namespace: dci
spec:
  type: Static
  startLabel: 15000
  endLabel: 15999
---
apiVersion: mpls.eda.nokia.com/v1alpha1
