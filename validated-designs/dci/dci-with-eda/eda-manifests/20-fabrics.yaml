      - eda.nokia.com/role=leaf,eda.nokia.com/site=dc2
    asnPool: leaf-asn-dc2
    systemPoolIPv4: systemipv4-dc2
  spines:
    spineNodeSelectors:
      - eda.nokia.com/role=spine,eda.nokia.com/site=dc2
    asnPool: spine-asn-dc2
    systemPoolIPv4: systemipv4-dc2
  borderLeafs:
    borderLeafNodeSelectors:
      - eda.nokia.com/role=dcgw,eda.nokia.com/site=dc2
    asnPool: dcgw-asn-dc2
    systemPoolIPv4: systemipv4-dc2
  interSwitchLinks:
    unnumbered: IPv6
    ipMTU: 9198
    linkSelectors:
      - eda.nokia.com/role=interSwitch,eda.nokia.com/site=dc2
      - eda.nokia.com/role=dcgwUplink,eda.nokia.com/site=dc2
  underlayProtocol:
    protocols:
      - EBGP
    bfd:
      enabled: true
      detectionMultiplier: 3
      desiredMinTransmitIntMs: 1000
      requiredMinReceiveIntMs: 1000
  overlayProtocol:
    protocol: EBGP
