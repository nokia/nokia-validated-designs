apiVersion: config.eda.nokia.com/v1
kind: Configlet
metadata:
  name: ipvrf-mh-mode-dc1
  namespace: dci
spec:
  operatingSystem: srl
  priority: 50
  endpoints:
    - dcgw1
    - dcgw2
  configs:
    - operation: Update
      path: '.network-instance{.name=="ipvrf-l3dci"}.protocols.bgp-evpn.bgp-instance{.id==1}'
      config: '{"multi-homing-mode":"network"}'
---
