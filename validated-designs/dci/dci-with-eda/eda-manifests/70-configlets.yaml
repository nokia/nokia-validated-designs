apiVersion: config.eda.nokia.com/v1
kind: Configlet
metadata:
  name: dc-pin-chain-dcgw1
  namespace: dci
spec:
  operatingSystem: srl
  priority: 50
  endpoints:
    - dcgw1
  configs:
    - operation: Update
      path: '.network-instance{.name=="default"}.protocols.bgp.group{.group-name=="bgpgroup-ebgp-dc1"}'
      config: '{"export-policy":["dcgw-dc-pin-dcgw1","ebgp-isl-export-policy-dc1"]}'
---
