      assignedNumber: "110"
  interconnectBGPInstance:
    controlPlane: EVPN
    encapsulation: MPLS
    evi: 1110
    exportTarget: target:65000:110
    importTarget: target:65000:110
    routeDistinguisher:
      administrator: 192.0.2.150
      assignedNumber: "1110"
    mpls:
      allowedTunnelTypes:
        - LDP
        - SR-ISIS
---
apiVersion: services.eda.nokia.com/v2
kind: RouterInterconnect
metadata:
  name: ipvrf-l3dci-dc1-ic
  namespace: dci
spec:
  routerRef:
    name: ipvrf-l3dci-dc1
    namespace: dci
  nodes:
    - dcgw1
    - dcgw2
  primaryBGPInstance:
    domainId: "65000:1"
  interconnectBGPInstance:
    controlPlane: IPVPN
    encapsulation: MPLS
    domainId: "65000:100"
    exportTarget: target:65000:3000
    importTarget: target:65000:3000
    routeDistinguisher:
      type: Type 1
      assignedNumber: "13000"
    mpls:
      allowedTunnelTypes:
        - LDP
        - SR-ISIS
---
