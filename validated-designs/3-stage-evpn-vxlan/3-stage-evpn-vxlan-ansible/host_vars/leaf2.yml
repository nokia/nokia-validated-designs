routers:
- name: vrf1
  vni: 10500
  evi: 500
- name: vrf2
  vni: 10501
  evi: 501
event_handler:
  node_isolation:
    down_links:
    - ethernet-1/6
    hold_down_time: 20000
    required_bgp_sessions: 1
