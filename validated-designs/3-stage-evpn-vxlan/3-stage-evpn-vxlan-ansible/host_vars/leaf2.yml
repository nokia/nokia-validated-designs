node:
  hostname: leaf2
  role: leaf
  router_id: 192.0.2.12
  asn: 65412
underlay_interfaces:
- name: ethernet-1/31
  peer_asn: 65500
- name: ethernet-1/32
  peer_asn: 65500
edge_interfaces:
- name: ethernet-1/3
  encap: dot1q
  labels:
    untagged-v10: true
lags:
- name: lag2
  description: leaf2-leaf3-leaf4-leaf5-lag2
  aggregate_id: '2'
  mode: all-active
  min_links: 1
  lacp:
    interval: fast
    system_id_mac: 00:00:22:33:44:55
    system_priority: 32768
    admin_key: 2
  fallback:
    mode: static
    timeout: 60
  reload_delay_timer: 100
  labels:
    untagged-v50: true
  members:
  - interface: ethernet-1/6
bridge_domains:
- name: macvrf-v10
  vni: 100101
  evi: 10
  access:
  - interface: ethernet-1/3
    vlan: untagged
  irb:
    anycast_gw: true
    ipv4: 172.16.10.254/24
    arp_timeout: 280
    proxy_arp: true
    ip_mtu: 9198
  router: vrf1
- name: macvrf-v20
  vni: 10020
  evi: 20
  irb:
    anycast_gw: true
    ipv4: 172.16.20.254/24
    arp_timeout: 280
    proxy_arp: true
    ip_mtu: 9198
  router: vrf1
- name: macvrf-v30
  vni: 10030
  evi: 30
  irb:
    anycast_gw: true
    ipv4: 172.16.30.254/24
    arp_timeout: 280
    proxy_arp: true
    ip_mtu: 9198
  router: vrf1
- name: macvrf-v40
  vni: 10040
  evi: 40
  irb:
    anycast_gw: true
    ipv4: 172.16.40.254/24
    arp_timeout: 280
    proxy_arp: true
    ip_mtu: 9198
  router: vrf2
- name: macvrf-v50
  vni: 10050
  evi: 50
  access:
  - interface: lag2
    vlan: untagged
  irb:
    anycast_gw: true
    ipv4: 172.16.50.254/24
    arp_timeout: 280
    proxy_arp: true
    ip_mtu: 9198
  router: vrf2
- name: macvrf-v60
  vni: 10060
  evi: 60
  irb:
    anycast_gw: true
    ipv4: 172.16.60.254/24
