node:
  hostname: leaf1
  role: leaf
  router_id: 192.0.2.11
  asn: 65411
underlay_interfaces:
- name: ethernet-1/31
  peer_asn: 65500
- name: ethernet-1/32
  peer_asn: 65500
edge_interfaces:
- name: ethernet-1/3
  encap: dot1q
  labels:
    tagged-v10: true
- name: ethernet-1/5
  encap: dot1q
  labels:
    untagged-v40: true
bridge_domains:
- name: macvrf-v10
  vni: 100101
  evi: 10
  access:
  - interface: ethernet-1/3
    vlan: '10'
  irb:
    anycast_gw: true
    ipv4: 172.16.10.254/24
    arp_timeout: 280
    proxy_arp: true
    ip_mtu: 9198
  router: vrf1
- name: macvrf-v20
  vni: 10020
  evi: 20
  irb:
    anycast_gw: true
    ipv4: 172.16.20.254/24
    arp_timeout: 280
    proxy_arp: true
    ip_mtu: 9198
  router: vrf1
- name: macvrf-v30
  vni: 10030
  evi: 30
  irb:
    anycast_gw: true
    ipv4: 172.16.30.254/24
    arp_timeout: 280
    proxy_arp: true
    ip_mtu: 9198
  router: vrf1
- name: macvrf-v40
  vni: 10040
  evi: 40
  access:
  - interface: ethernet-1/5
    vlan: untagged
  irb:
    anycast_gw: true
    ipv4: 172.16.40.254/24
    arp_timeout: 280
    proxy_arp: true
    ip_mtu: 9198
  router: vrf2
- name: macvrf-v50
  vni: 10050
  evi: 50
  irb:
    anycast_gw: true
    ipv4: 172.16.50.254/24
    arp_timeout: 280
    proxy_arp: true
    ip_mtu: 9198
  router: vrf2
- name: macvrf-v60
  vni: 10060
  evi: 60
  irb:
    anycast_gw: true
    ipv4: 172.16.60.254/24
    arp_timeout: 280
    proxy_arp: true
    ip_mtu: 9198
  router: vrf2
routers:
- name: vrf1
  vni: 10500
  evi: 500
- name: vrf2
  vni: 10501
  evi: 501
routed_interfaces:
- name: leaf-s5
  interface: ethernet-1/4
  router: vrf1
  vlan_id: 'null'
  ip_mtu: 1500
  arp_timeout: 14400
  ipv4_addresses:
  - ip_prefix: 172.16.100.0/31
    primary: true
static_routes:
- name: static-s5
  router: vrf1
  prefixes:
  - 172.16.92.0/24
  - 172.16.93.0/24
  - 172.16.94.0/24
  - 172.16.95.0/24
  nexthop_group:
    name: static-s5
    nexthops:
    - ip_address: 172.16.100.1
      resolve: false
