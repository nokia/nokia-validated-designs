routers:
- name: vrf1
  vni: 10500
  evi: 500
  node_selector:
  - eda.nokia.com/role=leaf
- name: vrf2
  vni: 10501
  evi: 501
  node_selector:
  - eda.nokia.com/role=leaf
vlans:
- name: tagged-v10
  bridge_domain: macvrf-v10
  vlan_id: '10'
  interface_selector:
  - eda.nokia.com/tagged-v10=enabled
- name: untagged-v10
  bridge_domain: macvrf-v10
  vlan_id: untagged
  interface_selector:
  - eda.nokia.com/untagged-v10=enabled
- name: untagged-v20
  bridge_domain: macvrf-v20
  vlan_id: untagged
