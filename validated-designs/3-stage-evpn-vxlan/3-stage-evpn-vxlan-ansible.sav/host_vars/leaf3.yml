node:
  hostname: leaf3
  role: leaf
  router_id: 192.168.254.13
  asn: 65413
  labels:
    eda.nokia.com/role: leaf
    eda.nokia.com/name: leaf3
    eda.nokia.com/security-profile: managed
underlay_interfaces:
- name: ethernet-1/31
  peer_asn: 65500
- name: ethernet-1/32
  peer_asn: 65500
edge_interfaces:
- name: ethernet-1/3
  encap: dot1q
  labels:
    eda.nokia.com/role: edge
    eda.nokia.com/untagged-v10: enabled
    eda.nokia.com/tagged-v99: enabled
lags:
- name: lag2
  description: leaf2-leaf3-leaf4-leaf5-lag2
  aggregate_id: '2'
  mode: all-active
  min_links: 1
  lacp:
    interval: fast
    system_id_mac: 00:00:22:33:44:55
    system_priority: 32768
    admin_key: 2
  fallback:
    mode: static
    timeout: 60
  reload_delay_timer: 100
  labels:
    eda.nokia.com/role: edge
    eda.nokia.com/untagged-v50: enabled
  members:
  - interface: ethernet-1/6
irb_interfaces:
- bridge_domain: macvrf-v10
  router: vrf1
  ipv4: 172.16.10.254/24
  anycast_gw: true
  proxy_arp: true
  arp_timeout: 280
  ip_mtu: 9394
  evpn_route_advertisement_type:
    rfc9135SymmetricMode: false
    arpDynamic: true
    arpStatic: true
    ndDynamic: false
    ndStatic: false
  host_route_populate:
    dynamic: true
    static: true
    evpn: false
