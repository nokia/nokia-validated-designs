routed_interfaces:
- name: leaf-s5
  interface: ethernet-1/4
  router: vrf1
  vlan_id: 'null'
  ip_mtu: 1500
  arp_timeout: 14400
  ipv4_addresses:
  - ip_prefix: 172.16.100.0/31
    primary: true
static_routes:
- name: static-s5
  router: vrf1
  prefixes:
  - 172.16.92.0/24
  - 172.16.93.0/24
  - 172.16.94.0/24
  - 172.16.95.0/24
  nexthop_group:
    name: static-s5
    nexthops:
    - ip_address: 172.16.100.1
      resolve: false
default_mtu:
  interface_mtu: 9412
  layer2_subif_mtu: 9412
  layer3_mtu: 9394
config_overrides:
- path: /system/information
  value:
    contact: support@nokia.com
