node:
  hostname: leaf1
  role: leaf
  router_id: 192.168.254.11
  asn: 65411
  labels:
    eda.nokia.com/role: leaf
    eda.nokia.com/name: leaf1
    eda.nokia.com/security-profile: managed
underlay_interfaces:
- name: ethernet-1/31
  peer_asn: 65500
- name: ethernet-1/32
  peer_asn: 65500
edge_interfaces:
- name: ethernet-1/3
  encap: dot1q
  labels:
    eda.nokia.com/role: edge
    eda.nokia.com/tagged-v10: enabled
    eda.nokia.com/tagged-v99: enabled
- name: ethernet-1/5
  encap: dot1q
  labels:
    eda.nokia.com/role: edge
    eda.nokia.com/untagged-v40: enabled
irb_interfaces:
- bridge_domain: macvrf-v10
  router: vrf1
  ipv4: 172.16.10.254/24
  anycast_gw: true
  proxy_arp: true
  arp_timeout: 280
  ip_mtu: 9394
  evpn_route_advertisement_type:
    rfc9135SymmetricMode: false
    arpDynamic: true
    arpStatic: true
    ndDynamic: false
    ndStatic: false
  host_route_populate:
    dynamic: true
    static: true
    evpn: false
