node:
  hostname: leaf6
  role: leaf
  router_id: 192.168.254.16
  asn: 65416
  labels:
    eda.nokia.com/role: leaf
    eda.nokia.com/name: leaf6
    eda.nokia.com/security-profile: managed
underlay_interfaces:
- name: ethernet-1/31
  peer_asn: 65500
- name: ethernet-1/32
  peer_asn: 65500
edge_interfaces:
- name: ethernet-1/6
  encap: dot1q
  labels:
    eda.nokia.com/role: edge
    eda.nokia.com/untagged-v60: enabled
lags:
- name: lag3
  description: leaf5-leaf6-lag3
  aggregate_id: '3'
  mode: port-active
  min_links: 1
  lacp:
    interval: fast
    system_id_mac: 00:00:00:00:55:66
    system_priority: 32768
    admin_key: 3
  fallback:
    mode: static
    timeout: 60
  reload_delay_timer: 100
  revertive: true
  df_preference: 500
  labels:
    eda.nokia.com/role: edge
    eda.nokia.com/untagged-v30: enabled
  members:
  - interface: ethernet-1/5
irb_interfaces:
- bridge_domain: macvrf-v10
  router: vrf1
  ipv4: 172.16.10.254/24
  anycast_gw: true
  proxy_arp: true
  arp_timeout: 280
  ip_mtu: 9394
  evpn_route_advertisement_type:
    rfc9135SymmetricMode: false
    arpDynamic: true
    arpStatic: true
    ndDynamic: false
    ndStatic: false
  host_route_populate:
    dynamic: true
    static: true
    evpn: false
