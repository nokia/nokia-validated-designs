# Routed interface to server s5
apiVersion: services.eda.nokia.com/v1
kind: RoutedInterface
metadata:
  name: leaf-s5
  namespace: eda
spec:
  vlanID: 'null'
  ipMTU: 1500
  learnUnsolicited: NONE
  arpTimeout: 14400
  interface: leaf1-ethernet-1-4
  router: vrf1
  ipv4Addresses:
    - ipPrefix: 172.16.100.0/31
      primary: true