# VRFs
apiVersion: services.eda.nokia.com/v1
kind: Router
metadata:
  name: vrf1
  namespace: eda
spec:
  type: EVPNVXLAN
  tunnelIndexPool: tunnel-index-pool
  vni: 10500
  evi: 500
  nodeSelector:
    - eda.nokia.com/role=leaf
---
apiVersion: services.eda.nokia.com/v1
kind: Router
metadata:
  name: vrf2
  namespace: eda
spec:
  type: EVPNVXLAN
  vni: 10501
  evi: 501
  tunnelIndexPool: tunnel-index-pool
  nodeSelector:
    - eda.nokia.com/role=leaf
---
# VLANs
apiVersion: services.eda.nokia.com/v1
kind: VLAN
metadata:
  name: untagged-v10
  namespace: eda
spec:
  vlanID: untagged
  bridgeDomain: macvrf-v10
  interfaceSelector:
    - eda.nokia.com/untagged-v10=enabled
---
apiVersion: services.eda.nokia.com/v1
kind: VLAN
metadata:
  name: tagged-v10
  namespace: eda
spec:
  bridgeDomain: macvrf-v10
  interfaceSelector:
    - eda.nokia.com/tagged-v10=enabled
  vlanID: "10"
