# IRB interfaces
apiVersion: services.eda.nokia.com/v1
kind: IRBInterface
metadata:
  name: irb-v10
  namespace: eda
spec:
  ipMTU: 1500
  learnUnsolicited: NONE
  arpTimeout: 280
  bridgeDomain: macvrf-v10
  router: vrf1
  ipAddresses:
    - ipv4Address:
        ipPrefix: 172.16.10.254/24
        primary: true
  evpnRouteAdvertisementType:
    rfc9135SymmetricMode: false
    arpDynamic: true
    arpStatic: true
    ndDynamic: false
    ndStatic: false
  l3ProxyARPND:
    proxyARP: true
    proxyND: false
  hostRoutePopulate:
    dynamic: true
    evpn: false
    static: true
---
