# bridge domains
# if needed, export/import RTs can be manually defined using exportTarget and importTarget options
# EDA makes life easier by just generating it for you
apiVersion: services.eda.nokia.com/v1
kind: BridgeDomain
metadata:
  name: macvrf-v10
  namespace: eda
spec:
  type: EVPNVXLAN
  tunnelIndexPool: tunnel-index-pool
  macLearning: true
  macAging: 300
  vni: 10010
  evi: 10
  macDuplicationDetection:
    enabled: true
    holdDownTime: 9
    monitoringWindow: 3
    action: StopLearning
    numMoves: 5
---
