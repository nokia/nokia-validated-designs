---
# yaml-language-server: $schema=../../schemas/services_fragment_schema.json
# Routed (L3) interfaces and static routes.

# Routed interfaces (L3 interfaces on specific ports)
routed_interfaces:
  - name: leaf-s5
    interface: leaf1-ethernet-1-4
    router: vrf1
    vlan_id: "null"
    ip_mtu: 1500
    arp_timeout: 14400
    ipv4_addresses:
      - ipPrefix: 172.16.100.0/31
        primary: true

# Static routes
static_routes:
  - name: static-s5
    router: vrf1
    nodes:
      - leaf1
    prefixes:
      - 172.16.92.0/24
      - 172.16.93.0/24
      - 172.16.94.0/24
      - 172.16.95.0/24
    nexthop_group:
      blackhole: false
      resolve: false
      nexthops:
        - resolve: false
          ipPrefix: 172.16.100.1
