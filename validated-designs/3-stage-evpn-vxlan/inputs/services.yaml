#       node_selector:
#         - eda.nokia.com/role=leaf
#         - eda.nokia.com/name=spine1          # extend to spine1
#
#   # Override or add a VLAN binding
#   vlans:
#     - name: tagged-v10
#       vlan_id: "100"                          # change VLAN ID
#
#   # Add a new routed interface
#   routed_interfaces:
#     - name: leaf2-uplink
#       interface: leaf2-ethernet-1-4
#       router: vrf1
#       vlan_id: "null"
#       ip_mtu: 9000
#       ipv4_addresses:
#         - ipPrefix: 172.16.101.0/31
#           primary: true
#
#   # Add a new static route
#   static_routes:
#     - name: default-route-vrf2
#       router: vrf2
#       nodes: [leaf1, leaf2]
#       prefixes: ["0.0.0.0/0"]
#       nexthop_group:
#         nexthops:
#           - ipPrefix: 172.16.40.1
