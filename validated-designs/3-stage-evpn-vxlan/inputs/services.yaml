---
# yaml-language-server: $schema=../schemas/services_schema.json
# 3-Stage EVPN VXLAN — Services Input
# Bridge domains, routers, IRB interfaces, and VLAN services.

# Bridge Domains (mac-vrfs)
bridge_domains:
  - name: macvrf-v10
    vni: 100101
    evi: 10
  - name: macvrf-v20
    vni: 10020
    evi: 20
  - name: macvrf-v30
    vni: 10030
    evi: 30
  - name: macvrf-v40
    vni: 10040
    evi: 40
  - name: macvrf-v50
    vni: 10050
    evi: 50
  - name: macvrf-v60
    vni: 10060
    evi: 60
  - name: macvrf-v99
    vni: 10099
    evi: 99
# Bridge domain with all optional fields (override via extras):
#   - name: macvrf-example
#     vni: 99999
#     evi: 999
#     # Design defaults applied automatically — override via extras:
#     # mac_learning: true
#     # mac_aging: 300                        # seconds (0 = disabled)
#     # mac_duplication:
#     #   enabled: true
#     #   hold_down_time: 9
#     #   monitoring_window: 3
#     #   action: StopLearning               # StopLearning | Blackhole | UseNetInstanceAction
#     #   num_moves: 5

# Routers (ip-vrfs)
routers:
  - name: vrf1
    vni: 10500
    evi: 500
    node_selector:
      - eda.nokia.com/role=leaf
  - name: vrf2
    vni: 10501
    evi: 501
    node_selector:
      - eda.nokia.com/role=leaf

# IRB Interfaces (bridge domain ↔ ip-vrf glue)
# Each IRB binds one bridge domain to one router
irb_interfaces:
  - name: irb-v10
    bridge_domain: macvrf-v10
    router: vrf1
    ipv4: 172.16.10.254/24
    proxy_arp: true
    arp_timeout: 280

  - name: irb-v20
    bridge_domain: macvrf-v20
    router: vrf1
    ipv4: 172.16.20.254/24
    proxy_arp: true
    arp_timeout: 280

  - name: irb-v30
    bridge_domain: macvrf-v30
    router: vrf1
    ipv4: 172.16.30.254/24
    proxy_arp: true
    arp_timeout: 280

  - name: irb-v40
    bridge_domain: macvrf-v40
    router: vrf2
    ipv4: 172.16.40.254/24
    proxy_arp: true
    arp_timeout: 280

  - name: irb-v50
    bridge_domain: macvrf-v50
    router: vrf2
    ipv4: 172.16.50.254/24
    proxy_arp: true
    arp_timeout: 280

  - name: irb-v60
    bridge_domain: macvrf-v60
    router: vrf2
    ipv4: 172.16.60.254/24
    proxy_arp: true
    arp_timeout: 280
# IRB interface with all optional fields (override via extras):
#   - name: irb-example
#     bridge_domain: macvrf-example
#     router: vrf1
#     ipv4: 172.16.99.254/24
#     proxy_arp: true
#     arp_timeout: 280
#     # Design defaults applied automatically — override via extras:
#     # description: "VLAN 99 gateway"
#     # proxy_nd: false
#     # ip_mtu: 9394                          # defaults to layer3_mtu from default_mtu
#     # learn_unsolicited: NONE               # NONE | GLOBAL
#     # Dual-stack addressing (alternative to ipv4 shorthand):
#     # ip_addresses:
#     #   - ipv4: { ip_prefix: "172.16.99.254/24", primary: true }
#     #     ipv6: { ip_prefix: "2001:db8:99::1/64", primary: true }

# VLAN services — attach bridge domains to interfaces via label selectors
vlans:
  # tagged VLAN 10 on leaf1-ethernet-1-3
  - name: tagged-v10
    bridge_domain: macvrf-v10
    vlan_id: "10"
    interface_selector:
      - eda.nokia.com/tagged-v10=enabled
 # untagged VLAN 10 on leaf2/leaf3 ethernet-1-3
  - name: untagged-v10
    bridge_domain: macvrf-v10
    vlan_id: untagged
    interface_selector:
      - eda.nokia.com/untagged-v10=enabled

  # untagged VLAN 20 on leaf4-ethernet-1-3
  - name: untagged-v20
    bridge_domain: macvrf-v20
    vlan_id: untagged
    interface_selector:
      - eda.nokia.com/untagged-v20=enabled

  # untagged VLAN 30 on LAG1 (leaf4-leaf5) + LAG3 (leaf5-leaf6)
  - name: untagged-v30
    bridge_domain: macvrf-v30
    vlan_id: untagged
    interface_selector:
      - eda.nokia.com/untagged-v30=enabled

  # untagged VLAN 40 on leaf1-ethernet-1-5
  - name: untagged-v40
    bridge_domain: macvrf-v40
    vlan_id: untagged
    interface_selector:
      - eda.nokia.com/untagged-v40=enabled

  # untagged VLAN 50 on LAG2 (leaf2-leaf3-leaf4-leaf5)
  - name: untagged-v50
    bridge_domain: macvrf-v50
    vlan_id: untagged
    interface_selector:
      - eda.nokia.com/untagged-v50=enabled

  # untagged VLAN 60 on leaf6-ethernet-1-6
  - name: untagged-v60
    bridge_domain: macvrf-v60
    vlan_id: untagged
    interface_selector:
      - eda.nokia.com/untagged-v60=enabled
#  - name: tagged-v99
#    bridge_domain: macvrf-v99
#    vlan_id: "99"
#    interface_selector:
#      - eda.nokia.com/tagged-v99=enabled
# Routed interfaces (L3 interfaces on specific ports)
routed_interfaces:
  - name: leaf-s5
    interface: leaf1-ethernet-1-4
    router: vrf1
    vlan_id: "null"
    ip_mtu: 1500
    arp_timeout: 14400
    ipv4_addresses:
      - ipPrefix: 172.16.100.0/31
        primary: true

# Static routes
static_routes:
  - name: static-s5
    router: vrf1
    nodes:
      - leaf1
    prefixes:
      - 172.16.92.0/24
      - 172.16.93.0/24
      - 172.16.94.0/24
      - 172.16.95.0/24
    nexthop_group:
      blackhole: false
      resolve: false
      nexthops:
        - resolve: false
          ipPrefix: 172.16.100.1

# ─────────────────────────────────────────────────────────────────────
# Extras — override design defaults or add new resources
# Extras use merge-by-name: if the name matches an existing resource,
# only the specified fields are overridden. New names are appended.
# ─────────────────────────────────────────────────────────────────────
# extras:
#   # Override MAC settings on an existing bridge domain
#   bridge_domains:
