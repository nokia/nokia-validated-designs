---
# yaml-language-server: $schema=../../schemas/topology_fragment_schema.json
# Unconstrained additions/overrides outside the locked design.
# Resources here are labeled nvd-design:extras.

extras:
  configlets:
    # Target by label selector
    - name: contact-info
      endpoint_selector:
        - eda.nokia.com/role=leaf
        - eda.nokia.com/role=spine
      priority: 100
      configs:
        - path: '.system.information'
          operation: Create
          config: '{ "contact": "support@nokia.com" }'
