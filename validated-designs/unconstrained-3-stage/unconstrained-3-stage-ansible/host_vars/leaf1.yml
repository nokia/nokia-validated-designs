node:
  hostname: leaf1
  role: leaf
  router_id: 10.0.0.1
  asn: 65001
edge_interfaces:
- name: ethernet-1/1
  encap: dot1q
  labels:
    tagged-v10: true
bridge_domains:
- name: macvrf-v10
  vni: 100101
  evi: 10
  access:
  - interface: ethernet-1/1
    vlan: '10'
  irb:
    anycast_gw: true
    ipv4: 172.16.10.254/24
    arp_timeout: 300
    proxy_arp: true
    ip_mtu: 9000
  router: vrf1
- name: macvrf-v20
  vni: 10020
  evi: 20
  irb:
    anycast_gw: true
    ipv4: 172.16.20.254/24
    arp_timeout: 280
    proxy_arp: true
  router: vrf1
- name: macvrf-v30
  vni: 10030
  evi: 30
  irb:
    anycast_gw: true
    ipv4: 172.16.30.254/24
    arp_timeout: 280
    proxy_arp: true
  router: vrf1
routers:
- name: vrf1
  vni: 10500
  evi: 500
