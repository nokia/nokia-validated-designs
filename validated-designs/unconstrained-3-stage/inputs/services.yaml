---
# yaml-language-server: $schema=../schemas/services_schema.json
# Unconstrained 3-Stage Fabric — Services Input

# ---------------------------------------------------------------------------
# Bridge Domains (mac-vrfs)
# ---------------------------------------------------------------------------
bridge_domains:
  - name: macvrf-v10
    vni: 100101
    evi: 10
    mac_learning: true
    mac_aging: 300
    mac_duplication:
      enabled: true
      hold_down_time: 9
      monitoring_window: 3
      action: StopLearning
      num_moves: 5

  - name: macvrf-v20
    vni: 10020
    evi: 20

  - name: macvrf-v30
    vni: 10030
    evi: 30

# ---------------------------------------------------------------------------
# Routers (ip-vrfs)
# ---------------------------------------------------------------------------
routers:
  - name: vrf1
    vni: 10500
    evi: 500
    node_selector:
      - eda.nokia.com/role=leaf

# ---------------------------------------------------------------------------
# IRB Interfaces
# ---------------------------------------------------------------------------
irb_interfaces:
  # Full-featured IRB: dual-stack, all EVPN/routing knobs exposed
  - name: irb-v10
    description: "VLAN 10 gateway — dual-stack with host routes"
    bridge_domain: macvrf-v10
    router: vrf1
    ip_addresses:
      - ipv4:
          ip_prefix: 172.16.10.254/24
          primary: true
        ipv6:
          ip_prefix: "2001:db8:10::1/64"
          primary: true
    ip_mtu: 9000
    arp_timeout: 300
    learn_unsolicited: GLOBAL
    proxy_arp: true
    proxy_nd: true
    evpn_route_advertisement_type: type2WithType5
    host_route_populate: true

  # IPv4-only with type-5 prefix routes
  - name: irb-v20
    bridge_domain: macvrf-v20
    router: vrf1
    ip_addresses:
      - ipv4:
          ip_prefix: 172.16.20.254/24
          primary: true
    arp_timeout: 280
    proxy_arp: true
    proxy_nd: false
    evpn_route_advertisement_type: type5Only
    host_route_populate: false

  # Minimal IRB — all optional fields use defaults
  - name: irb-v30
    bridge_domain: macvrf-v30
    router: vrf1
    ip_addresses:
      - ipv4:
          ip_prefix: 172.16.30.254/24
          primary: true

# ---------------------------------------------------------------------------
# VLANs
# ---------------------------------------------------------------------------
vlans:
  - name: tagged-v10
    bridge_domain: macvrf-v10
    vlan_id: "10"
    interface_selector:
      - eda.nokia.com/tagged-v10=enabled

  - name: untagged-v10
    bridge_domain: macvrf-v10
    vlan_id: untagged
    interface_selector:
      - eda.nokia.com/untagged-v10=enabled

  - name: untagged-v20
    bridge_domain: macvrf-v20
    vlan_id: untagged
    interface_selector:
      - eda.nokia.com/untagged-v20=enabled

  - name: untagged-v30
    bridge_domain: macvrf-v30
    vlan_id: untagged
    interface_selector:
      - eda.nokia.com/untagged-v30=enabled

# ---------------------------------------------------------------------------
# Routed Interfaces
# ---------------------------------------------------------------------------
routed_interfaces:
  - name: leaf4-routed-1
    interface: leaf4-ethernet-1-1
    router: vrf1
    vlan_id: "null"
    ip_mtu: 1500
    arp_timeout: 14400
    ipv4_addresses:
      - ipPrefix: 172.16.100.0/31
        primary: true

# ---------------------------------------------------------------------------
# Static Routes
# ---------------------------------------------------------------------------
static_routes:
  - name: static-default
    router: vrf1
    nodes:
      - leaf4
    prefixes:
      - 172.16.200.0/24
    nexthop_group:
      blackhole: false
      resolve: false
      nexthops:
        - resolve: false
          ipPrefix: 172.16.100.1
